[gcode_macro SAVE_PENDANT_LOCATION]
gcode:
    {% set name = params.NAME|default("temp_point") %}
    {% set pos = printer.toolhead.position %}
    
    {action_call_remote_method("save_taught_point", 
                               point_name=name, 
                               x=pos.x, 
                               y=pos.y, 
                               z=pos.z)}
    M118 Saved {name} location.