[gcode_macro SAVE_PENDANT_LOCATION]
description: Saves a coordinate point to a specified cfg file for the teach pendant
gcode:
    {% set macro_name = params.MACRO_NAME|default("TOOL_PATH")|upper %}
    {% set location_name = params.LOCATION_NAME|default("pt")|lower %}
    {% set file_name = params.FILE|default("teach_pendant.cfg") %}
    {% set mode = params.MODE|default("ABSOLUTE") %}
    {% set x = params.X|default(0.0) %}
    {% set y = params.Y|default(0.0) %}
    {% set z = params.Z|default(0.0) %}
    
    {% set gcode_cmd = "G90\nG1 X" ~ x ~ " Y" ~ y ~ " Z" ~ z ~ " F3000" if mode == "ABSOLUTE" else "G91\nG1 X" ~ x ~ " Y" ~ y ~ " Z" ~ z ~ " F3000\nG90" %}
    
    {action_respond_info("Saving " ~ location_name ~ " to " ~ macro_name)}
    # The backend Python extension parses and handles writing this into your file storage.
